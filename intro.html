<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banzook — Speak in Prints</title>
  <meta name="theme-color" content="#000000" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    /* ── Canvas ─────────────────────────────────────────────────── */
    #stage {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 5;
    }

    /* ── Logo Layer ──────────────────────────────────────────────── */
    #logo-layer {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; pointer-events: none;
    }

    /* Primary: the actual logo image */
    #logo-img {
      display: block;
      width: min(78vw, 640px);
      height: auto;
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    #logo-img.loaded { opacity: 1; }
    #logo-img.hidden { opacity: 0 !important; transition: opacity 0.05s linear; }

    /* Fallback: Bebas Neue text (shows when image is missing) */
    #logo-fallback {
      display: none;
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(5rem, 20vw, 14rem);
      color: #fff;
      letter-spacing: -0.01em;
      line-height: 1;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #logo-fallback.show   { display: block; }
    #logo-fallback.loaded { opacity: 1; }
    #logo-fallback.hidden { opacity: 0 !important; transition: opacity 0.05s linear; }

    /* ── Click zone ──────────────────────────────────────────────── */
    #click-zone {
      position: fixed; inset: 0;
      z-index: 20; cursor: pointer;
    }

    /* ── Hint ────────────────────────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 52px; left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Sans', sans-serif;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #444; white-space: nowrap;
      z-index: 25;
      opacity: 0;
      animation: fadeIn 0.4s ease-out 1.1s forwards;
    }

    /* ── Skip ────────────────────────────────────────────────────── */
    #skip {
      position: fixed;
      bottom: 28px; right: 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #333; cursor: pointer;
      z-index: 50;
      opacity: 0;
      animation: fadeIn 0.3s ease-out 0.5s forwards;
      transition: color 0.2s ease;
      text-decoration: none;
    }
    #skip:hover { color: #888; }

    /* ── Page-out veil ───────────────────────────────────────────── */
    #veil {
      position: fixed; inset: 0;
      background: #000; z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease;
    }
    #veil.on { opacity: 1; pointer-events: auto; }

    /* ── Dev panel (press D) ─────────────────────────────────────── */
    #dev {
      position: fixed; top: 14px; left: 14px;
      background: rgba(18,18,18,0.92); border: 1px solid #282828;
      padding: 10px 14px;
      font-family: 'DM Sans', monospace; font-size: 10px;
      line-height: 1.9; color: #555; letter-spacing: 0.08em;
      z-index: 100; display: none;
    }
    #dev.on { display: block; }
    #dev b   { color: #888; }

    @keyframes fadeIn { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      #logo-img, #logo-fallback { transition: opacity 0.3s ease !important; }
    }
  </style>
</head>

<body>

  <!-- Particle canvas -->
  <canvas id="stage" aria-hidden="true"></canvas>

  <!-- Logo: image first, Bebas Neue text fallback if image missing -->
  <div id="logo-layer">
    <img id="logo-img"
         src="assets/logo.png"
         alt="Banzook — Speak in Prints" />
    <span id="logo-fallback" aria-hidden="true">BANZOOK</span>
  </div>

  <!-- Full-screen click target -->
  <div id="click-zone"
       role="button" tabindex="0"
       aria-label="Click anywhere to enter Banzook"></div>

  <!-- Hints -->
  <p id="hint" aria-hidden="true">Click anywhere to enter</p>
  <a id="skip" role="button" tabindex="0" aria-label="Skip intro">Skip</a>

  <!-- Transition veil to homepage -->
  <div id="veil" aria-hidden="true"></div>

  <!-- Dev panel (press D) -->
  <div id="dev">
    <div><b>BANZOOK DEV</b></div>
    <div>Source : <b id="d-src">—</b></div>
    <div>Pixels : <b id="d-px">—</b></div>
    <div>FPS    : <b id="d-fps">—</b></div>
    <div>State  : <b id="d-st">idle</b></div>
    <div style="margin-top:5px;color:#333;">
      D=toggle · R=reset · Spc=trigger · Esc=skip
    </div>
  </div>

  <script>
  /* ================================================================
     BANZOOK INTRO ENGINE
     - Loads logo image from assets/logo.png
     - Falls back to Bebas Neue text if image is missing
     - Samples letterform pixels for particle disintegration
     - Click anywhere → dust off → navigate to index.html
     ================================================================ */
  (function () {
    'use strict';

    /* ── CONFIG — tweak these values to tune the effect ─────────── */

    const CFG = {
      // Particle counts by device class
      DESKTOP  : 2200,
      TABLET   : 1100,
      MOBILE   : 500,

      // Timing (all in ms)
      ANIM_MS  : 1500,   // how long particles animate
      NAV_MS   : 1750,   // ms after click before navigation starts
      VEIL_MS  : 420,    // veil fade duration

      // Physics (per-frame)
      SPEED_MIN  : 0.8,
      SPEED_MAX  : 6.2,
      GRAVITY    : 0.042,
      DRAG       : 0.967,
      TURB       : 0.10,
      UP_MIN     : -2.1,   // upward velocity bias
      UP_MAX     : -0.2,
      SCATTER    : Math.PI * 0.56,

      // Visual
      SZ_MIN     : 0.7,
      SZ_MAX     : 2.4,
      FADE_START : 0.28,   // fraction of lifetime before alpha drops
      STAGGER    : 0.17,   // max random per-particle delay (s)

      FONT_FB    : '"Bebas Neue", Impact, sans-serif',
      DEST       : 'index.html',
    };

    /* ── STATE ───────────────────────────────────────────────────── */

    const S = { IDLE: 0, ANIM: 1, DONE: 2 };
    let state   = S.IDLE;
    let useImg  = false;   // true = sampling from logo image

    /* ── DOM ─────────────────────────────────────────────────────── */

    const canvas    = document.getElementById('stage');
    const ctx       = canvas.getContext('2d');
    const logoImg   = document.getElementById('logo-img');
    const logoFb    = document.getElementById('logo-fallback');
    const clickZone = document.getElementById('click-zone');
    const hintEl    = document.getElementById('hint');
    const skipEl    = document.getElementById('skip');
    const veil      = document.getElementById('veil');
    const devEl     = document.getElementById('dev');
    const dSrc      = document.getElementById('d-src');
    const dPx       = document.getElementById('d-px');
    const dFps      = document.getElementById('d-fps');
    const dSt       = document.getElementById('d-st');

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dpr     = Math.min(window.devicePixelRatio || 1, 2);
    let devMode   = false;
    const fpsBuf  = [];
    let lastStamp = 0;

    /* ── CANVAS ──────────────────────────────────────────────────── */

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width  = w * dpr; canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();

    /* ── TARGET PARTICLE COUNT ───────────────────────────────────── */

    function targetN() {
      const w = window.innerWidth;
      return w < 600 ? CFG.MOBILE : w < 1024 ? CFG.TABLET : CFG.DESKTOP;
    }

    /* ── PIXEL SAMPLING ──────────────────────────────────────────── */

    // Sample from the logo image drawn to an offscreen canvas.
    // Returns null if CORS blocks getImageData (handled by caller).
    function sampleImage(img) {
      const W = window.innerWidth, H = window.innerHeight;
      const off = document.createElement('canvas');
      off.width = W; off.height = H;
      const oc = off.getContext('2d', { willReadFrequently: true });

      // Match CSS: min(78vw, 640px)
      const maxW  = Math.min(W * 0.78, 640);
      const scale = maxW / img.naturalWidth;
      const dw    = img.naturalWidth  * scale;
      const dh    = img.naturalHeight * scale;
      const dx    = (W - dw) / 2;
      const dy    = (H - dh) / 2;

      oc.drawImage(img, dx, dy, dw, dh);

      let data;
      try {
        data = oc.getImageData(0, 0, W, H).data;
      } catch (_) {
        return null;   // tainted canvas (CORS) — caller will use text fallback
      }

      const lit = [];
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          // Bright pixel in the logo (white on dark)
          if (data[i] > 110 && data[i + 3] > 80) lit.push(x, y);
        }
      }
      return subsample(lit, targetN());
    }

    // Sample Bebas Neue text as fallback.
    function sampleText() {
      const W = window.innerWidth, H = window.innerHeight;
      const fs = Math.min(Math.max(72, W * 0.19), 224);
      const off = document.createElement('canvas');
      off.width = W; off.height = H;
      const oc = off.getContext('2d', { willReadFrequently: true });
      oc.fillStyle = '#fff';
      oc.font = `${fs}px ${CFG.FONT_FB}`;
      oc.textAlign = 'center'; oc.textBaseline = 'middle';
      oc.fillText('BANZOOK', W / 2, H / 2);
      const data = oc.getImageData(0, 0, W, H).data;
      const lit = [];
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          if (data[i + 3] > 100) lit.push(x, y);
        }
      }
      return subsample(lit, targetN());
    }

    function subsample(flat, N) {
      const total = flat.length / 2;
      const step  = Math.max(1, Math.floor(total / N));
      const out   = [];
      for (let i = 0; i < total; i += step) out.push(flat[i * 2], flat[i * 2 + 1]);
      return out;
    }

    /* ── BUILD PARTICLES ─────────────────────────────────────────── */

    function buildParticles(flat) {
      if (!flat || flat.length === 0) return [];
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      const maxD = Math.hypot(cx, cy);
      const n = flat.length / 2;
      const out = new Array(n);
      for (let i = 0; i < n; i++) {
        const px = flat[i * 2], py = flat[i * 2 + 1];
        const dx = px - cx, dy = py - cy;
        const d  = Math.hypot(dx, dy) || 1;
        const ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * 2 * CFG.SCATTER;
        const spd = CFG.SPEED_MIN + Math.random() * (CFG.SPEED_MAX - CFG.SPEED_MIN)
                    * (0.35 + (d / maxD) * 0.65);
        const up  = CFG.UP_MIN + Math.random() * (CFG.UP_MAX - CFG.UP_MIN);
        out[i] = {
          x  : px,  y  : py,
          vx : Math.cos(ang) * spd,
          vy : Math.sin(ang) * spd + up,
          sz : CFG.SZ_MIN + Math.random() * (CFG.SZ_MAX - CFG.SZ_MIN),
          a0 : 0.5 + Math.random() * 0.5,
          ls : 0.7 + Math.random() * 0.3,
          dl : Math.random() * CFG.STAGGER,
        };
      }
      return out;
    }

    /* ── ANIMATION LOOP ──────────────────────────────────────────── */

    let particles = [];
    let animStart = null;
    let rafId = null;
    let navDone = false;

    function loop(stamp) {
      if (!animStart) animStart = stamp;
      const t   = (stamp - animStart) / 1000;
      const dur = CFG.ANIM_MS / 1000;

      if (lastStamp) { fpsBuf.push(1000 / (stamp - lastStamp)); if (fpsBuf.length > 30) fpsBuf.shift(); }
      lastStamp = stamp;

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      let alive = false;
      for (let i = 0, n = particles.length; i < n; i++) {
        const p   = particles[i];
        const pt  = Math.max(0, t - p.dl);
        const prg = pt / (dur * p.ls);
        if (prg >= 1) continue;
        alive = true;

        // Ease-in: hold in place for first ~100ms then explode
        const ease = Math.min(1, pt / 0.10);
        p.vx += (Math.random() - 0.5) * CFG.TURB;
        p.vy += CFG.GRAVITY;
        p.vx *= CFG.DRAG;
        p.vy *= CFG.DRAG;
        p.x  += p.vx * ease;
        p.y  += p.vy * ease;

        const alpha = prg < CFG.FADE_START
          ? p.a0
          : p.a0 * (1 - (prg - CFG.FADE_START) / (1 - CFG.FADE_START));
        if (alpha < 0.01) continue;

        ctx.globalAlpha = alpha;
        ctx.fillStyle   = '#ffffff';
        const s = p.sz;
        ctx.fillRect(p.x - s * .5, p.y - s * .5, s, s);
      }
      ctx.globalAlpha = 1;

      if (devMode) {
        const fps = fpsBuf.length ? Math.round(fpsBuf.reduce((a,b)=>a+b,0)/fpsBuf.length) : '—';
        dPx.textContent  = particles.length;
        dFps.textContent = fps;
        dSt.textContent  = (state === S.ANIM ? 'animating' : 'done') + ' / ' + t.toFixed(2) + 's';
      }

      // Navigate once NAV_MS has elapsed
      if (!navDone && t >= CFG.NAV_MS / 1000) {
        navDone = true;
        navigate();
      }

      if (alive || t < dur) rafId = requestAnimationFrame(loop);
      else ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    /* ── NAVIGATE TO HOMEPAGE ────────────────────────────────────── */

    function navigate() {
      if (state === S.DONE) return;
      state = S.DONE;
      veil.classList.add('on');
      setTimeout(() => { window.location.href = CFG.DEST; }, CFG.VEIL_MS + 40);
    }

    /* ── TRIGGER ─────────────────────────────────────────────────── */

    let prePixels = null;   // pre-sampled pixel positions

    function trigger() {
      if (state !== S.IDLE) return;
      state = S.ANIM;

      // Remove all idle chrome
      clickZone.style.pointerEvents = 'none';
      hintEl.style.transition = 'opacity 0.15s ease';
      hintEl.style.opacity    = '0';
      skipEl.style.display    = 'none';

      // Reduced-motion: skip animation entirely
      if (reduced) { navigate(); return; }

      // Get pixels (pre-sampled or fresh)
      let px = prePixels;
      if (!px) {
        px = useImg ? (sampleImage(logoImg) || sampleText()) : sampleText();
      }
      particles = buildParticles(px);

      // Instantly hide whichever logo element is visible
      (useImg ? logoImg : logoFb).classList.add('hidden');

      navDone = false; animStart = null; lastStamp = 0;
      rafId = requestAnimationFrame(loop);
    }

    /* ── SKIP ────────────────────────────────────────────────────── */

    function skip() {
      if (state === S.DONE) return;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      navigate();
    }

    /* ── EVENT LISTENERS ─────────────────────────────────────────── */

    clickZone.addEventListener('click', trigger);
    clickZone.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trigger(); }
    });
    skipEl.addEventListener('click', skip);
    skipEl.addEventListener('keydown', e => { if (e.key === 'Enter') skip(); });

    document.addEventListener('keydown', e => {
      if (e.key === 'd' || e.key === 'D') { devMode = !devMode; devEl.classList.toggle('on', devMode); }
      if (e.key === 'r' || e.key === 'R') window.location.reload();
      if ((e.key === ' ') && state === S.IDLE) { e.preventDefault(); trigger(); }
      if (e.key === 'Escape') skip();
    });

    window.addEventListener('resize', () => {
      resize();
      if (state === S.IDLE) prePixels = null;
    });

    /* ── INIT ────────────────────────────────────────────────────── */

    function precompute() {
      if (reduced) return;
      prePixels = useImg
        ? (sampleImage(logoImg) || sampleText())
        : sampleText();
      if (devMode) dPx.textContent = (prePixels?.length / 2 || 0) + ' (cached)';
    }

    // Image success: use it
    logoImg.onload = function () {
      useImg = true;
      logoImg.classList.add('loaded');
      if (devMode) dSrc.textContent = 'image (assets/logo.png)';
      // Give the browser a tick to paint the image before sampling
      setTimeout(precompute, 120);
    };

    // Image fail: use Bebas Neue text fallback
    logoImg.onerror = function () {
      useImg = false;
      logoImg.style.display = 'none';
      logoFb.classList.add('show');
      if (devMode) dSrc.textContent = 'text fallback (Bebas Neue)';
      document.fonts.ready.then(() => {
        logoFb.classList.add('loaded');
        setTimeout(precompute, 120);
      });
    };

    // Handle cached image (already loaded before handlers attached)
    if (logoImg.complete) {
      logoImg.naturalWidth > 0 ? logoImg.onload() : logoImg.onerror();
    }

  })();
  </script>
</body>
</html>
